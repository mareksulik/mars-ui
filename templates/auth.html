<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>Access</title>
<link rel="stylesheet" href="ds.css">
<style>
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:400px;width:100%;text-align:center;padding:40px 36px}
.logo{height:24px;width:auto;margin:0 auto 22px;color:var(--mu-gray-1000)}
h1{font-size:20px;line-height:28px;margin-bottom:6px}
p{margin:0 auto 24px;color:var(--mu-gray-900);font-size:14px}
#pin{height:48px;font-size:20px;text-align:center;letter-spacing:8px;margin-bottom:12px}
.err{color:var(--mu-red-900);font-size:13px;margin-top:12px;display:none}
.fine{margin-top:20px;font-size:12px;line-height:18px;color:var(--mu-gray-900)}
</style>
</head>
<body>
  <div class="card">
    <!-- client logo (inline SVG, fill="currentColor") -->
    <svg class="logo" viewBox="0 0 120 22" aria-label="Client"><text x="0" y="17" font-family="Geist, sans-serif" font-weight="600" font-size="18" fill="currentColor">CLIENT</text></svg>
    <h1>Internal report</h1>
    <p>Enter the PIN to continue</p>
    <form id="f">
      <input id="pin" class="input input-mono" type="password" inputmode="numeric" autocomplete="off" autofocus>
      <button class="btn btn-primary btn-block" type="submit">Enter</button>
    </form>
    <div class="err" id="err">Wrong PIN, try again.</div>
    <div class="fine">Contains confidential client data. Do not forward.</div>
  </div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const r = await fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: document.getElementById('pin').value }) });
  if (r.ok) { location.href = '/'; } else { document.getElementById('err').style.display = 'block'; document.getElementById('pin').value = ''; }
});
</script>
</body>
</html>
